<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan M02 | Maria Hana Gultom</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            color: #17324d;
            background:
                radial-gradient(circle at top left, #dff5ff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #b9e7ff 0%, transparent 35%),
                linear-gradient(135deg, #f8fcff, #eaf7ff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 60px;
            box-shadow: 0 25px 70px rgba(46, 150, 210, 0.18);
        }

        /* Decorative circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .circle-one {
            width: 220px;
            height: 220px;
            background: rgba(100, 197, 244, 0.16);
            top: -100px;
            right: -70px;
        }

        .circle-two {
            width: 150px;
            height: 150px;
            background: rgba(64, 169, 231, 0.12);
            bottom: -70px;
            left: -50px;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 50px;
            background: #e0f4ff;
            color: #1688c9;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(38px, 6vw, 68px);
            line-height: 1.05;
            letter-spacing: -2px;
            color: #123a5a;
            margin-bottom: 18px;
        }

        h1 span {
            color: #32a8e8;
        }

        .subtitle {
            max-width: 650px;
            font-size: 18px;
            line-height: 1.7;
            color: #5b7287;
            margin-bottom: 40px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 42px;
        }

        .info-card {
            padding: 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid #d8effc;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(48, 157, 211, 0.12);
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #71a2bd;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .value {
            font-size: 21px;
            font-weight: 700;
            color: #17476a;
        }

        .divider {
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                #b8e5fa,
                transparent
            );
            margin-bottom: 30px;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .footer-text {
            color: #7790a2;
            font-size: 14px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 16px;
            background: #effaff;
            border-radius: 50px;
            color: #248fc5;
            font-size: 13px;
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #39b6ed;
            box-shadow: 0 0 12px rgba(57, 182, 237, 0.7);
        }

        @media (max-width: 700px) {
            .card {
                padding: 38px 25px;
                border-radius: 24px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
            }

            h1 {
                letter-spacing: -1px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <section class="card">

            <div class="circle circle-one"></div>
            <div class="circle circle-two"></div>

            <div class="content">

                <div class="badge">
                    M02 • PENGEMBANGAN & OPERASI
                </div>

                <h1>
                    Latihan <span>M02</span>
                </h1>

                <p class="subtitle">
                    Pengembangan dan Operasi — sebuah latihan untuk memahami
                    proses pengembangan, pengelolaan, dan pengoperasian aplikasi
                    dalam lingkungan teknologi modern.
                </p>

                <div class="info-grid">

                    <div class="info-card">
                        <div class="label">Nama</div>
                        <div class="value">Maria Hana Gultom</div>
                    </div>

                    <div class="info-card">
                        <div class="label">NIM</div>
                        <div class="value">231112124</div>
                    </div>

                </div>

                <div class="divider"></div>

                <div class="footer">

                    <div class="footer-text">
                        © 2026 Maria Hana Gultom
                    </div>

                    <div class="status">
                        <span class="dot"></span>
                        Latihan M02
                    </div>

                </div>

            </div>

        </section>
    </main>

</body>
</html>
